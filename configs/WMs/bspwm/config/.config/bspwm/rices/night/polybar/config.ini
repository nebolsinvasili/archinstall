# ---- ПОДКЛЮЧЕНИЕ ОТДЕЛЬНОГО ФАЙЛА С ЦВЕТАМИ И МОДУЛЯМИ  --------------------
include-file = colors.ini
include-file = modules.ini


# ---- ЛЕВЫЙ БАР С ВОРКСПЕЙСАМИ ----------------------------------------------
[bar/left]
width = 15%
height = 24pt
radius = 12
offset-x = 1%
offset-y = 5
background = ${color.bg}
foreground = ${color.cyan}
padding-left = 2

font-0 = JetBrainsMono-Bold:style=Bold:pixelsize=10;3
font-1 = Symbols Nerd Font:style=Regular:pixelsize=10;2

modules-left = xworkspaces
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm


# ---- XWINDOW ---------------------------------------------------------------
[bar/xwindow]
width = 260
height = 24pt
radius = 12
offset-x = 340
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}

font-0 = JetBrainsMono-Bold:style=Bold:pixelsize=10;3
font-1 = Symbols Nerd Font:style=Regular:pixelsize=10;2

modules-center = xwindow
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm


# ---- ЦЕНТРАЛЬНЫЙ БАР С ЧАСАМИ И ПОГОДОЙ ------------------------------------
[bar/center]
width = 12%
height = 24pt
radius = 12
offset-x = 44%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}

font-0 = JetBrainsMono-Bold:style=Bold:pixelsize=10;3
font-1 = Symbols Nerd Font:style=Regular:pixelsize=10;2

modules-center = date weather
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm


# ---- ТРЕЙ ------------------------------------------------------------------
[bar/tray]
width = 80
height = 24pt
radius = 12
offset-x = 65%
offset-y = 5
background = ${color.bg}
foreground = ${color.bg}

font-0 = JetBrainsMono-Bold:style=Bold:pixelsize=10;3
font-1 = Symbols Nerd Font:style=Regular:pixelsize=10;2

tray-position = center
tray-background = ${color.bg}
modules-center = void
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm


# ---- ПРАВЫЙ БАР СО ВСЕМ ОСТАЛЬНЫМ ------------------------------------------
[bar/right]
width = 15%
height = 24pt
radius = 12
offset-x = 75%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
module-margin = 1

font-0 = JetBrainsMono-Bold:style=Bold:pixelsize=10;3
font-1 = Symbols Nerd Font:style=Regular:pixelsize=10;2
font-2 = JetBrainsMono-Bold:style=Bold:pixelsize=8;2

modules-center = pulseaudio xkeyboard memory cpu
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm


# ---- POWEROFF --------------------------------------------------------------
[bar/poweroff]
width = 2%
height = 18pt
radius = 12
offset-x = 97%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}

font-0 = JetBrainsMono-Bold:style=Bold:pixelsize=10;2
font-1 = Symbols Nerd Font:style=Regular:pixelsize=10;2

modules-center = powermenu
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm


# ---- НАСТРОЙКИ -------------------------------------------------------------
[settings]
screenchange-reload = true
pseudo-transparency = true

term screen-256color

# Font
font_family      JetBrains Mono Nerd Font
italic_font      auto
bold_font        auto
bold_italic_font auto	
font_size        10.0	

# Mouse and Cursor
include themes/default.conf
background_opacity         0.95
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
mouse_hide_wait            0.0
select_by_word_characters :@-./_~?&=%+#

# Scroll
scrollback_lines        10000
scrollback_pager less +G -R
wheel_scroll_multiplier 3.0

# Delay
repaint_delay    10
input_delay      3

# Bell
visual_bell_duration 0.0
enable_audio_bell    no

# Open URL
open_url_with default

# TERM Environment
term xterm-kitty

# Window
window_margin_width 10 10
window_resize_step_cells 5
window_resize_step_lines 5
confirm_os_window_close 0

# Clipboard
map super+v             paste_from_clipboard
map ctrl+shift+s        paste_from_selection
map super+c             copy_to_clipboard
map shift+insert        paste_from_selection

# Font Size Management
map ctrl+plus      increase_font_size
map ctrl+minus     decrease_font_size
map ctrl+equal     restore_font_size
